# Chotu user-facing machine configuration.
#
# This file describes the desired state of the Chotu machine.
# Provisioning and machine setup components consume the fields relevant to them.
#
# Compatibility-critical versions for system packages and drivers are controlled
# by Chotu/bootstrap and are not exposed here.

machine:
  # Cloud / provisioning configuration
  instance_type: g6.xlarge

  # The Ubuntu 26.04 AMI to boot. This is a provisioning concern; the setup
  # daemon only reports a warning if the machine turns out to be on a different
  # Ubuntu release.
  image_id: ""

  region: us-west-2
  ssh_key_path: .

  # A spot machine can be reclaimed at any moment, so it cannot also be
  # persistent. This and storage.persist are two halves of one decision: spot
  # pairs with persist: false, on-demand pairs with persist: true. The config
  # loader rejects any other combination rather than building a machine that
  # silently loses the workspace.
  use_spot: false

  # Machine storage configuration
  storage:
    # Set false for a disposable spot machine. The EC2 instance store is
    # mounted at /data and the workspace, Docker root, model cache and Chotu
    # state all live on it, so the machine can be reclaimed without losing work.
    #
    # Set true for an on-demand machine with a root disk that survives. The
    # workspace, Docker root, model cache and Chotu state then live on the root
    # disk below, and the instance store at /data is only scratch space.
    persist: true

    # Root disk sizing is a Terraform concern; the setup daemon only logs it.
    root_disk_size_gb: 80
    root_disk_type: gp2


# Persistent workspace storage and synchronization.
s3:
  enabled: true
  bucket_name: chotu-workspace
  region: us-west-2

  sync:
    prefix: workspace
    interval: 1m

    # Additional exclusions.
    # Chotu may also maintain its own mandatory/default exclusions.
    exclusions:
      - .git/**
      - node_modules/**
      - .venv/**
      - __pycache__/**
      - .cache/**


# Local LLM inference configuration.
inference:
  runtime: vllm
  model: cyankiwi/Qwen3-Coder-30B-A3B-Instruct-AWQ-4bit
  quantization: awq

  # Local means the inference endpoint is intended for use from the machine
  # / SSH tunnel rather than public exposure.
  access: local
  
  # Pinned to an exact version and digest, deliberately.
  #
  # vLLM's `latest` tag moves several times a week and its command line changes
  # with it, so a floating tag means a machine that worked this morning can fail
  # this afternoon for reasons that have nothing to do with this config. The
  # version tag says what is running; the digest says which bytes.
  #
  # To upgrade, pick a version from https://hub.docker.com/r/vllm/vllm-openai/tags
  # and resolve its digest with:
  #   docker buildx imagetools inspect vllm/vllm-openai:v0.30.0-x86_64
  # The -x86_64 variant is used because Chotu only supports x86_64, and it keeps
  # the tag and the digest describing the same platform image.
  image: vllm/vllm-openai:v0.30.0-x86_64@sha256:5f5e535216848d0c52159c8c13a0af04be5f6fe1a84e79914300610796f76d40
  port: 8000

  resources:
    max_model_len: 14336
    gpu_memory_utilization: 0.97
    max_output_tokens: 4096


# Development environment.
coding:
  opencode: true


# Progress page served over HTTP so the user can see what the machine is doing
# while it comes up. Runs as a container pulled from a registry.
status_page:
  enabled: true
  image: goravaa/chotu-status:latest
  port: 8081


# Additional development/build tools requested by the user.
tooling:
  packages:
    - git
    - tmux
    - htop
    - nvtop
    - python3.14
    - go1.22.0

